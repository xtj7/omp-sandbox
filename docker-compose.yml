services:
  dind:
    image: docker:28-dind   # amd64 + arm64 variants available [1]
    privileged: true
    command: dockerd-entrypoint.sh -H tcp://0.0.0.0:2375
    volumes:
      # persist the nested daemon's image cache across restarts,
      # otherwise every dind restart re-pulls everything
      - dind-data:/var/lib/docker

  omp-sandbox:
    build: .
    container_name: omp-sandbox
    init: true
    tty: true
    stdin_open: true
    depends_on:
      - dind
    working_dir: /home/omp/dev
    volumes:
      - ./models.yml:/home/omp/.omp/agent/models.yml
      - ./mcp.json:/home/omp/.omp/agent/mcp.json
      - ./dev:/home/omp/dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # dind listens on plaintext TCP; this is fine because the traffic
      # stays on the compose-internal network (nothing is published)
      - DOCKER_HOST=tcp://dind:2375
      - PUPPETEER_EXECUTABLE_PATH=/usr/local/bin/chromium
    command: tmux new-session -A -s omp

volumes:
  dind-data:
